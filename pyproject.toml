[project]
name = "codestra-document-intelligence"
version = "0.1.0"
description = "Standalone multi-tenant document intelligence API/orchestrator"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
