name: Required exact-SHA CI

on:
  pull_request:
    branches: [development]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full repository commit SHA to certify
        required: true
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  admission:
    name: exact-SHA admission
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce trusted source and development lane
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test "$HEAD_REPO" = "$THIS_REPO"
          else
            test "${GITHUB_REF_NAME}" = "development"
          fi

  exact-worker:
    name: exact-SHA worker
    needs: admission
    runs-on: [self-hosted, Linux, X64, codestra-ci, codestra-document-intelligence]
    timeout-minutes: 30
    env:
      EVENT_NAME: ${{ github.event_name }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Reject operation residue
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .git/MERGE_HEAD
          test ! -e .git/CHERRY_PICK_HEAD
          test ! -d .git/rebase-merge
          test ! -d .git/rebase-apply
      - name: Validate committed diff and repository integrity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA" "$EXPECTED_SHA"
          else
            git diff --check "$EXPECTED_SHA^" "$EXPECTED_SHA"
          fi
          git fsck --no-progress
      - name: Record exact-SHA evidence in runner-controlled storage
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/exact-sha-evidence.txt"
          umask 077
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=$(git rev-parse HEAD)"
            echo "runner=${RUNNER_NAME}"
          } > "$evidence"
      - name: Upload exact-SHA evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-sha-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/exact-sha-evidence.txt
          if-no-files-found: error
          retention-days: 14

  exact-sha:
    name: Test exact repository SHA
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    if: ${{ always() }}
    needs: [admission, exact-worker]
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve required aggregate context
        shell: bash
        env:
          ADMISSION: ${{ needs.admission.result }}
          WORKER: ${{ needs.exact-worker.result }}
        run: |
          set -euo pipefail
          test "$ADMISSION" = "success"
          test "$WORKER" = "success"

  publish-manual-status:
    name: Publish manual exact-SHA status
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [exact-sha]
    runs-on: ubuntu-24.04
    steps:
      - name: Bind manual certification result to requested SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RESULT: ${{ needs.exact-sha.result }}
        run: |
          set -euo pipefail
          state=failure
          if [[ "$RESULT" == "success" ]]; then state=success; fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}"             -f state="$state"             -f context="codestra/exact-sha-manual"             -f description="Manual exact-SHA certification: $RESULT"


      - name: Publish target-SHA certification status
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state=success \
            -f context="required-exact-sha/target" \
            -f description="Exact-SHA certification passed" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
